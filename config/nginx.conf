# =============================================================================
# Upstream Definitions with Health Checks and Load Balancing
# =============================================================================

upstream api_gateway {
    # Load balancing method (least_conn for better distribution)
    least_conn;
    
    # Primary API Gateway server
    server api-gateway:3000 weight=5 max_fails=3 fail_timeout=30s;
    
    # Keepalive connections for better performance
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

upstream grafana {
    # Grafana monitoring service
    server grafana:3000 weight=1 max_fails=3 fail_timeout=30s;
    
    # Keepalive connections
    keepalive 8;
    keepalive_requests 500;
    keepalive_timeout 60s;
}

# =============================================================================
# Shared Proxy Timeout Settings
# =============================================================================
map $upstream_response_time $upstream_status {
    default "healthy";
    ""      "unknown";
}

server {
    listen 80;
    server_name localhost;

    # Basic security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Logging
    access_log /var/log/nginx/access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Proxy to API Gateway
    location /api/ {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Increased timeouts for LLM responses
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # Proxy to Grafana for monitoring
    location /monitoring/ {
        proxy_pass http://grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
