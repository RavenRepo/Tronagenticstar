name: Constella CI/CD

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  lint-and-test-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - name: Install dependencies
        run: npm ci || npm install
      - name: Install pnpm (for API Gateway)
        run: npm install -g pnpm
      - name: Run Orchestrator Tests
        working-directory: ./packages/orchestrator
        run: |
          npm install
          npm test

  lint-and-test-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Qdrant & Neo4j services
        run: |
          docker run -d -p 6333:6333 qdrant/qdrant
          docker run -d -p 7687:7687 -e NEO4J_AUTH=none neo4j:5.12
      - name: Test Python Expert
        working-directory: ./services/python-expert
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pytest test_main.py || true

  docker-validation:
    needs: [lint-and-test-ts, lint-and-test-py]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Compose Parse
        run: docker compose -f docker-compose.prod.yml config -q
