# ============================================================================
# CONSTELLA AI PLATFORM - SITE CONFIGURATION
# ============================================================================
# This file handles:
#   - HTTP -> HTTPS redirect
#   - Let's Encrypt SSL termination
#   - API Gateway reverse proxy (/api/*, /v1/*)
#   - Orchestrator WebSocket proxy (/ws)
#   - Grafana dashboard proxy (/grafana/)
#   - Security headers on every response
#   - Per-endpoint rate limiting
#   - Request size limits
#
# DNS prerequisite:
#   Point your domain's A record to your VPS IP (147.93.105.214)
#
# SSL bootstrap (run once before starting Nginx with SSL):
#   docker compose run --rm certbot certonly \
#     --webroot -w /var/www/certbot \
#     -d constella.yourdomain.com \
#     --email admin@yourdomain.com --agree-tos --no-eff-email
# ============================================================================

# --------------------------------------------------------------------------
# HTTP server — redirect to HTTPS + ACME challenge
# --------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN} www.${DOMAIN};

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Health check for Docker / uptime monitors (no redirect)
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------------
# HTTPS server — main application
# --------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${DOMAIN} www.${DOMAIN};

    # ------------------------------------------------------------------
    # SSL / TLS configuration
    # ------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # Mozilla Intermediate compatibility (TLS 1.2+)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # SSL session caching
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ------------------------------------------------------------------
    # Security headers (applied to every response)
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header X-Frame-Options           "DENY"                             always;
    add_header X-XSS-Protection          "1; mode=block"                    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss://$host https://$host; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Hide server software identity
    server_tokens off;

    # ------------------------------------------------------------------
    # Client limits
    # ------------------------------------------------------------------
    client_max_body_size 10m;

    # Global connection limit per IP
    limit_conn conn_per_ip 50;

    # ------------------------------------------------------------------
    # Common proxy settings (reused via include-like approach)
    # ------------------------------------------------------------------

    # ACME challenge (also on 443 for redundancy)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # ------------------------------------------------------------------
    # Health check (public, no auth)
    # ------------------------------------------------------------------
    location = /health {
        proxy_pass http://api_gateway/health;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;

        access_log off;
    }

    # ------------------------------------------------------------------
    # API v1 routes — all agent and platform operations
    # ------------------------------------------------------------------
    location /v1/ {
        limit_req zone=api_general burst=20 nodelay;
        limit_req zone=api_agents  burst=10 nodelay;

        proxy_pass http://api_gateway;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    30s;

        # Don't buffer large agent responses
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
    }

    # ------------------------------------------------------------------
    # Orchestrator direct endpoints (analyze, agents list, execute)
    # ------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_general burst=15 nodelay;

        proxy_pass http://api_gateway;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    30s;
    }

    # ------------------------------------------------------------------
    # Orchestrator - analyze endpoint (longer timeout for multi-agent)
    # ------------------------------------------------------------------
    location /analyze {
        limit_req zone=api_agents burst=5 nodelay;

        proxy_pass http://orchestrator;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    180s;  # Multi-agent workflows can be slow
        proxy_send_timeout    30s;
    }

    # ------------------------------------------------------------------
    # WebSocket endpoint for real-time updates
    # ------------------------------------------------------------------
    location /ws {
        limit_req zone=ws_connect burst=3 nodelay;

        proxy_pass http://orchestrator;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        proxy_connect_timeout 10s;
        proxy_read_timeout    3600s;  # Keep WebSocket alive for 1 hour
        proxy_send_timeout    3600s;
    }

    # ------------------------------------------------------------------
    # Metrics endpoint (internal use, extra auth check)
    # ------------------------------------------------------------------
    location /metrics {
        # Only allow from private/local networks; deny public
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        proxy_pass http://api_gateway/metrics;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }

    # ------------------------------------------------------------------
    # Grafana dashboard (optional monitoring UI)
    # ------------------------------------------------------------------
    location /grafana/ {
        limit_req zone=api_auth burst=10 nodelay;

        proxy_pass http://grafana/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # Grafana needs inline scripts/styles
        # Override the global CSP for this location
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss://$host https://$host; font-src 'self' data:; frame-ancestors 'self';" always;
    }

    # Grafana WebSocket (live dashboard updates)
    location /grafana/api/live/ {
        proxy_pass http://grafana/api/live/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ------------------------------------------------------------------
    # Static documentation site (if deployed)
    # ------------------------------------------------------------------
    location /docs {
        alias /var/www/docs;
        index index.html;
        try_files $uri $uri/ /docs/index.html;

        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # ------------------------------------------------------------------
    # Root — serve a minimal landing or redirect to docs
    # ------------------------------------------------------------------
    location = / {
        return 200 '{"service":"Constella AI Operating Platform","status":"online","docs":"/docs","api":"/v1/","health":"/health"}';
        add_header Content-Type application/json;
    }

    # ------------------------------------------------------------------
    # Block common attack paths
    # ------------------------------------------------------------------
    location ~ /\.(git|env|htaccess|htpasswd|DS_Store) {
        deny all;
        return 404;
    }

    location ~ /(wp-admin|wp-login|wp-content|xmlrpc\.php|phpmyadmin|admin\.php) {
        deny all;
        return 404;
    }

    # ------------------------------------------------------------------
    # Deny all other paths
    # ------------------------------------------------------------------
    location / {
        limit_req zone=api_general burst=10 nodelay;

        proxy_pass http://api_gateway;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;
    }
}
