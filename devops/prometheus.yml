global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "orchestrator-py"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["orchestrator-py:8000"]

  - job_name: "nats"
    metrics_path: "/varz"
    params:
      format: ["prometheus"]
    static_configs:
      - targets: ["nats:8222"]

  - job_name: "qdrant"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["qdrant:6333"]

  - job_name: "errorgold-listener"
    static_configs:
      - targets: ["errorgold-listener:8002"] 

  - job_name: "retriever"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["retriever:8001"] 

  - job_name: "embedding"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["embedding:8002"]

  - job_name: "neo4j"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["neo4j:7474"] 

  - job_name: "designforge"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["designforge:8010"]

  - job_name: "securishield"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["securishield:8011"]

  - job_name: "codecraft"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["codecraft:8012"]

  - job_name: "perfpulse"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["perfpulse:8013"]

  - job_name: "soc2-compliance"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["soc2-compliance:8020"] 