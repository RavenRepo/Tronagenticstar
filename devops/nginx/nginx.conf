# ============================================================================
# CONSTELLA AI PLATFORM - NGINX MAIN CONFIGURATION
# ============================================================================
# Optimized for: Hostinger VPS KVM 2 (2 CPU / 8GB RAM)
# ============================================================================

user  nginx;
worker_processes  2;  # Match CPU count on KVM 2

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -----------------------------------------------------------------------
    # Logging
    # -----------------------------------------------------------------------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

    log_format  json  escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
    '}';

    access_log  /var/log/nginx/access.log  json;

    # -----------------------------------------------------------------------
    # Performance
    # -----------------------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens      off;  # Hide Nginx version

    # Gzip compression
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    4;
    gzip_min_length    256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # -----------------------------------------------------------------------
    # Client limits
    # -----------------------------------------------------------------------
    client_max_body_size    10m;
    client_body_timeout     30s;
    client_header_timeout   30s;
    send_timeout            30s;

    # Buffers
    client_body_buffer_size   16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    proxy_buffer_size         16k;
    proxy_buffers             4 32k;
    proxy_busy_buffers_size   64k;

    # -----------------------------------------------------------------------
    # Rate limiting zones
    # -----------------------------------------------------------------------
    # General API rate limit: 30 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;

    # Auth endpoints: 5 requests/second per IP (brute-force protection)
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

    # Agent execution: 10 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_agents:10m rate=10r/s;

    # WebSocket connections: 2 per second per IP
    limit_req_zone $binary_remote_addr zone=ws_connect:5m rate=2r/s;

    # Global connection limit per IP
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # Rate limit response
    limit_req_status  429;
    limit_conn_status 429;

    # -----------------------------------------------------------------------
    # Security headers (applied globally)
    # -----------------------------------------------------------------------
    # These are set as maps so they can be overridden per-location if needed
    map $sent_http_content_type $x_content_type_options {
        default "nosniff";
    }
    map $sent_http_content_type $x_frame_options {
        default "DENY";
    }

    # -----------------------------------------------------------------------
    # Upstream backends
    # -----------------------------------------------------------------------
    upstream api_gateway {
        server api-gateway:3000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream orchestrator {
        server orchestrator:8001 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }

    upstream grafana {
        server grafana:3000 max_fails=3 fail_timeout=30s;
        keepalive 4;
    }

    # -----------------------------------------------------------------------
    # Default server - reject unrecognized hosts
    # -----------------------------------------------------------------------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Health check endpoint for Docker / load balancers
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Reject everything else on unrecognized hosts
        location / {
            return 444;
        }
    }

    # -----------------------------------------------------------------------
    # Include per-site configurations from conf.d/
    # -----------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
